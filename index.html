<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Start Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="container">
        <div class="clock">
            <div id="time">08:46 PM</div>
            <div id="date">SATURDAY, AUGUST 1</div>
        </div>

        <form id="search-form" class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search-input" type="search" placeholder="Search Google..." autocomplete="off">
        </form>

        <div class="shortcuts">
            <a href="https://www.youtube.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://www.facebook.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-facebook"></i>
                <span>Facebook</span>
            </a>
            <a href="https://www.instagram.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://www.pinterest.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-pinterest"></i>
                <span>Pinterest</span>
            </a>
            <a href="https://www.reddit.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-reddit"></i>
                <span>Reddit</span>
            </a>
            <a href="https://x.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-x-twitter"></i>
                <span>X (Twitter)</span>
            </a>
            <a href="https://chatgpt.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-openai"></i>
                <span>ChatGPT</span>
            </a>
            <a href="https://gemini.google.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-google"></i>
                <span>Gemini</span>
            </a>
            <a href="https://mail.google.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-solid fa-envelope"></i>
                <span>Gmail</span>
            </a>
            <a href="https://chromewebstore.google.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-chrome"></i>
                <span>Chrome Web Store</span>
            </a>
            <a href="https://github.com" class="shortcut" target="_blank" rel="noopener">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
