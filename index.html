<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hella New Tab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="clock">
        <div id="time">08:46 PM</div>
        <div id="date">SATURDAY, AUGUST 1</div>
    </header>

    <main class="container">
        <form id="search-form" class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search-input" type="search" placeholder="Search Google..." autocomplete="off" autofocus>
        </form>

        <div id="shortcuts-grid"></div>
    </main>

    <dialog id="edit-modal">
        <h2>Edit shortcut</h2>
        <label for="shortcut-name">Name</label>
        <input id="shortcut-name" type="text">
        <label for="shortcut-url">URL</label>
        <input id="shortcut-url" type="text">
        <div class="modal-buttons">
            <button id="cancel-edit" type="button">Cancel</button>
            <button id="save-edit" type="button">Save</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
